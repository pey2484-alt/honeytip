<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한꿀팁 데모</title>

<style>
  body{margin:0;font-family:sans-serif;background:#FFF3B0;color:#333;}
  .top{background:black;color:white;padding:10px;text-align:center;font-size:24px;display:flex;align-items:center;justify-content:center;}
  .top img{height:30px;margin-right:10px;}
  .screen{display:none;padding:20px;}
  .show{display:block;}
  input, select, textarea, button{width:90%;margin:5px 0;padding:8px;border-radius:5px;border:1px solid #ccc;}
  button{background:#FFD700;color:black;font-weight:bold;cursor:pointer;}
  .bottom{position:fixed;bottom:0;width:100%;background:black;color:white;display:flex;justify-content:space-around;padding:10px;}
  .post{background:white;padding:10px;margin:10px;border-radius:10px;}
  .badge{background:#FFD700;padding:2px 6px;border-radius:4px;font-size:12px;}
  .attendance div{display:inline-block;width:30px;height:30px;border:1px solid black;border-radius:50%;line-height:30px;text-align:center;margin:3px;}
  .checked{background:#FFD700;color:white;font-weight:bold;}
</style>
</head>
<body>

<div class="top"><img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" />한꿀팁</div>

<!-- 로그인 -->
<div id="login" class="screen show">
  <h2>로그인 / 회원가입</h2>
  <input id="id" placeholder="이메일">
  <input id="pw" placeholder="비밀번호" type="password">
  <select id="job">
    <option>초등학생</option><option>중학생</option><option>고등학생</option>
    <option>대학생</option><option>직장인</option><option>주부</option>
    <option>은퇴자</option>
  </select>
  <button onclick="login()">로그인</button>
  <button onclick="join()">회원가입</button>
  <p style="font-size:12px;">당신의 직업에 따라 게시글이 추천됩니다.</p>
</div>

<!-- 홈 -->
<div id="home" class="screen">
  <h2>🏠 홈</h2>
  <button onclick="checkAttendance()">출석체크</button>
  <div class="attendance" id="attendance"></div>
  <h3>🔥 인기게시글</h3>
  <div id="bestPosts">아직 인기글 없음</div>
  <h3>🆕 최신글</h3>
  <select id="jobFilter" onchange="drawPosts()">
    <option>전체</option><option>초등학생</option><option>중학생</option><option>고등학생</option>
    <option>대학생</option><option>직장인</option><option>주부</option><option>은퇴자</option>
  </select>
  <div id="posts"></div>
  <button onclick="showWrite()">글쓰기</button>
  <button onclick="showMe()">내정보</button>
</div>

<!-- 글쓰기 -->
<div id="write" class="screen">
  <h2>글쓰기</h2>
  <input id="title" placeholder="제목">
  <input id="hashtags" placeholder="#해시태그">
  <textarea id="content" style="width:90%;height:150px;"></textarea>
  <button onclick="addPost()">등록</button>
</div>

<!-- 내정보 -->
<div id="me" class="screen">
  <h2>내정보</h2>
  <div id="myname"></div>
  <div id="myTier"></div>
  <div id="myHoney"></div>
  <div id="myPosts"></div>
  <button onclick="logout()">로그아웃</button>
</div>

<div class="bottom">
  <div onclick="goHome()">홈</div>
  <div onclick="showWrite()">+</div>
  <div onclick="showMe()">내정보</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFsX__LeM3jGJ3pXsab_0rxJ5C1weoRHA",
  authDomain: "honeytip-badb0.firebaseapp.com",
  projectId: "honeytip-badb0",
  storageBucket: "honeytip-badb0.appspot.com",
  messagingSenderId: "601225679455",
  appId: "1:601225679455:web:a688bccc656bf1474681ea"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user=null;

async function join(){
  const email = prompt("이메일 입력");
  const pw = prompt("비밀번호 입력");
  const userJob = document.getElementById("job").value;
  try{
    const userCredential = await createUserWithEmailAndPassword(auth,email,pw);
    const uid = userCredential.user.uid;
    await addDoc(collection(db,"users"), {uid,email,job:userJob,tier:"아카시아",attendance:0,honey:0});
    alert("회원가입 완료");
  }catch(e){alert(e.message);}
}

async function login(){
  const email = document.getElementById("id").value;
  const pw = document.getElementById("pw").value;
  try{
    const userCredential = await signInWithEmailAndPassword(auth,email,pw);
    const uid = userCredential.user.uid;
    const q = query(collection(db,"users"),where("uid","==",uid));
    const snapshot = await getDocs(q);
    snapshot.forEach(docSnap => { user = {...docSnap.data(), docId: docSnap.id}; });
    showHome();
    renderAttendance();
    drawPosts();
  }catch(e){alert(e.message);}
}

async function logout(){
  await signOut(auth);
  showLogin();
}

function hideAll(){
  document.getElementById("login").classList.remove("show");
  document.getElementById("home").classList.remove("show");
  document.getElementById("write").classList.remove("show");
  document.getElementById("me").classList.remove("show");
}

function showLogin(){hideAll(); document.getElementById("login").classList.add("show");}
function showHome(){hideAll(); document.getElementById("home").classList.add("show");}
function showWrite(){hideAll(); document.getElementById("write").classList.add("show");}
function showMe(){hideAll(); document.getElementById("me").classList.add("show"); renderMyInfo();}
function goHome(){showHome(); drawPosts();}

async function addPost(){
  const t = document.getElementById('title').value;
  const c = document.getElementById('content').value;
  const hashtags = document.getElementById('hashtags').value.split(",");
  await addDoc(collection(db,"posts"),{
    title:t, content:c, hashtags:hashtags, job:user.job, author:user.email, tier:user.tier, likes:0, comments:[], timestamp:Date.now()
  });
  alert("글 등록 완료!");
  showHome();
}

async function drawPosts(){
  const filter = document.getElementById('jobFilter').value;
  let postsDiv = document.getElementById('posts');
  let html = "";
  const q = collection(db,"posts");
  const snapshot = await getDocs(q);
  snapshot.forEach(docSnap=>{
    const p = docSnap.data();
    if(filter=="전체" || p.job==filter){
      html+=`<div class="post">
        <h3>${p.title} <span class="badge">${p.job}</span></h3>
        <p>${p.content}</p>
        <p>👍 ${p.likes} | 💬 ${p.comments.length}</p>
      </div>`;
    }
  });
  postsDiv.innerHTML = html || "게시글 없음";
}

// 출석체크
async function checkAttendance(){
  if(!user) return;
  if(user.attendance>=20){alert("출석 완료!"); return;}
  user.attendance++;
  user.honey+=1;
  // 등급 상승
  if(user.attendance==5) user.tier="라벤더";
  else if(user.attendance==10) user.tier="로즈마리";
  else if(user.attendance>=15) user.tier="유채";
  await updateDoc(doc(db,"users",user.docId),{attendance:user.attendance,tier:user.tier,honey:user.honey});
  renderAttendance();
  alert(`출석체크 완료! 현재 등급: ${user.tier}, 꿀: ${user.honey}`);
}

function renderAttendance(){
  let div = document.getElementById('attendance'); div.innerHTML="";
  for(let i=1;i<=20;i++){
    const d = document.createElement('div');
    d.innerText=i;
    if(user.attendance>=i) d.classList.add('checked');
    div.appendChild(d);
  }
}

function renderMyInfo(){
  document.getElementById('myname').innerText = "닉네임: "+user.email;
  document.getElementById('myTier').innerText = "등급: "+user.tier;
  document.getElementById('myHoney').innerText = "꿀: "+user.honey;
}

</script>
</body>
</html>
