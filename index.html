<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한꿀팁 - 꿀 한스푼의 지혜</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-honey { background-color: #FFD700; }
        .hidden { display: none; }
        .honey-border { border: 4px solid black; }
    </style>
</head>
<body class="bg-honey min-h-screen font-sans text-black">

    <div id="page-login" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-black italic">한꿀팁 🍯</h1>
            <p class="text-sm font-bold mt-2 font-mono">"한꿀팁 한다~"</p>
        </div>

        <div class="w-full max-w-sm space-y-3 bg-white p-6 rounded-3xl honey-border shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
            <input type="text" id="user-id" placeholder="아이디" class="w-full p-3 border-2 border-black rounded-xl">
            <input type="password" id="user-pw" placeholder="비밀번호(6자 이상)" class="w-full p-3 border-2 border-black rounded-xl">
            
            <div class="py-2">
                <label class="block font-black text-sm mb-2">직업을 선택하세요:</label>
                <select id="user-job" class="w-full p-3 border-2 border-black rounded-xl bg-yellow-50 font-bold">
                    <option value="초등학생">초등학생</option>
                    <option value="중학생">중학생</option>
                    <option value="고등학생">고등학생</option>
                    <option value="대학생">대학생</option>
                    <option value="직장인">직장인</option>
                    <option value="결혼/육아">결혼/육아</option>
                    <option value="취준생">취준생</option>
                    <option value="은퇴 준비/후">은퇴 준비/후</option>
                </select>
            </div>

            <button onclick="handleLogin()" class="w-full bg-black text-white p-4 rounded-2xl font-black text-lg active:scale-95 transition">로그인하기</button>
            <button onclick="handleSignUp()" class="w-full border-2 border-black p-3 rounded-2xl font-bold bg-white active:scale-95 transition">회원가입하기</button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="bg-white border-b-4 border-black p-4 flex justify-between items-center sticky top-0 z-50">
            <span class="font-black italic text-xl">🍯 한꿀팁</span>
            <span id="user-rank-display" class="font-bold text-sm bg-honey px-3 py-1 rounded-full border-2 border-black">🌸 아카시아</span>
        </header>

        <div id="page-home" class="p-4 space-y-6">
            <h2 class="text-xl font-black italic">✨ <span id="display-job">직업</span> 맞춤 꿀팁</h2>
            <div id="post-list" class="space-y-4 pb-24">
                </div>
        </div>

        <nav class="fixed bottom-0 w-full bg-white border-t-4 border-black h-20 flex justify-around items-center z-50">
            <button onclick="location.reload()" class="flex flex-col items-center"><span class="text-2xl">🏠</span></button>
            <button onclick="alert('게시판 준비 중!')" class="flex flex-col items-center"><span class="text-2xl">📋</span></button>
            <button onclick="firebase.auth().signOut().then(()=>location.reload())" class="flex flex-col items-center"><span class="text-2xl">🚪</span><span class="text-[8px] font-bold">로그아웃</span></button>
        </nav>
    </div>

    <script>
        // 보내주신 실제 설정값을 적용했습니다!
        const firebaseConfig = {
          apiKey: "AIzaSyCFsX__LeM3jGJ3pXsab_0rxJ5C1weoRHA",
          authDomain: "honeytip-badb0.firebaseapp.com",
          projectId: "honeytip-badb0",
          storageBucket: "honeytip-badb0.firebasestorage.app",
          messagingSenderId: "601225679455",
          appId: "1:601225679455:web:a688bccc656bf1474681ea",
          measurementId: "G-GGY0VYSWDB"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        const rankIcons = { 아카시아: '🌸', 라벤더: '🪻', 로즈마리: '🌿', 유채: '🌼' };

        // 가입 기능
        async function handleSignUp() {
            const id = document.getElementById('user-id').value;
            const pw = document.getElementById('user-pw').value;
            const job = document.getElementById('user-job').value;

            if (!id || pw.length < 6) { alert("아이디 입력 및 비밀번호 6자 이상 필수!"); return; }

            try {
                // 이메일 형식이 아니면 가입이 안되므로 임시로 붙임
                const userCredential = await auth.createUserWithEmailAndPassword(id + "@hkt.com", pw);
                await db.collection("users").doc(userCredential.user.uid).set({
                    userId: id,
                    job: job,
                    rank: "아카시아",
                    attendance: 0
                });
                alert("반가워요! 회원가입 성공! 이제 로그인하세요.");
            } catch (e) {
                if(e.code === "auth/email-already-in-use") alert("이미 있는 아이디예요!");
                else alert("에러: " + e.message);
            }
        }

                // 로그인 기능
        async function handleLogin() {
            const idInput = document.getElementById('user-id').value.trim(); // 공백 제거 추가
            const pw = document.getElementById('user-pw').value;

            // 아이디에 @가 없으면 자동으로 붙여주고, 있으면 그대로 사용
            const email = idInput.includes('@') ? idInput : idInput + "@hkt.com";

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, pw);
                const userDoc = await db.collection("users").doc(userCredential.user.uid).get();
                
                if (userDoc.exists()) {
                    currentUser = userDoc.data();
                    alert("🍯 한꿀팁 한다~!");
                    
                    document.getElementById('page-login').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('display-job').innerText = currentUser.job;
                    document.getElementById('user-rank-display').innerText = rankIcons[currentUser.rank] + " " + currentUser.rank;
                    
                    renderPosts(currentUser.job);
                } else {
                    alert("계정은 있으나 상세 정보가 없습니다. 다시 가입해주세요.");
                }
            } catch (e) {
                alert("로그인 실패! 아이디나 비번이 틀렸거나 가입되지 않은 계정입니다.");
            }
        } // <--- 이 마지막 중괄호가 꼭 있어야 합니다!

    

        // 맞춤형 글 목록 (예시 데이터)
        function renderPosts(job) {
            const list = document.getElementById('post-list');
            const posts = [
                { title: "초딩의 슬라임 관리법", job: "초등학생" },
                { title: "직장인 연차 눈치 안보고 쓰는 법", job: "직장인" },
                { title: "대학생 국가장학금 신청 팁", job: "대학생" },
                { title: "은퇴 후 건강 관리 비법", job: "은퇴 준비/후" }
            ];
            
            list.innerHTML = posts
                .filter(p => p.job === job)
                .map(p => `<div class="bg-white p-5 rounded-3xl border-4 border-black font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">${p.title}</div>`)
                .join('');
        }
    </script>
</body>
</html>
