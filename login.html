<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>한꿀팁 로그인</title>

<style>

body{
background:#FFD700;
font-family:sans-serif;
text-align:center;
}

.box{
margin-top:100px;
}

input{
width:200px;
height:30px;
margin:5px;
}

button{
width:210px;
height:35px;
margin:5px;
}

</style>

</head>

<body>

<div class="box">

<h1>🍯 한꿀팁</h1>

<br>

<input id="id" placeholder="아이디">

<br>

<input id="pw" placeholder="비밀번호" type="password">

<br>

<button id="loginBtn">
로그인
</button>

<br>

<button id="joinBtn">
회원가입
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyCFsX__LeM3jGJ3pXsab_0rxJ5C1weoRHA",

authDomain: "honeytip-badb0.firebaseapp.com",

projectId: "honeytip-badb0",

storageBucket: "honeytip-badb0.firebasestorage.app",

messagingSenderId: "601225679455",

appId: "1:601225679455:web:a688bccc656bf1474681ea"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const emailInput =
document.getElementById("id");

const pwInput =
document.getElementById("pw");

const joinBtn =
document.getElementById("joinBtn");

const loginBtn =
document.getElementById("loginBtn");

/* 회원가입 */

joinBtn.onclick = function(){

createUserWithEmailAndPassword(
auth,
emailInput.value,
pwInput.value
)

.then(()=>{

alert("회원가입 성공!");

})

.catch((error)=>{

if(error.code=="auth/email-already-in-use"){

alert("이미 가입된 계정입니다");

}

else{

alert("회원가입 실패");

}

});

};

/* 로그인 */

loginBtn.onclick = function(){

signInWithEmailAndPassword(
auth,
emailInput.value,
pwInput.value
)

.then(()=>{

alert("로그인 성공!");

setTimeout(function(){

window.location.href="home.html";

},1000);

})

.catch(()=>{

alert("아이디 또는 비밀번호 틀림");

});

};

</script>

</body>

</html>
